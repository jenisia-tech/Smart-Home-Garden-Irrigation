
name: Smart Garden Irrigation CI

on:
  push:
  workflow_dispatch:

jobs:
  test-irrigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run irrigation unit tests
        run: python -m unittest -v
